name: Harmonia
options:
  bundleIdPrefix: com.apple.harmonia
  deploymentTarget:
    iOS: "17.0"
targets:
  Harmonia:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Harmonia
    settings:
      base:
        INFOPLIST_FILE: Harmonia/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.harmonia.camera
        PRODUCT_NAME: Harmonia
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGNING_ALLOWED: false
