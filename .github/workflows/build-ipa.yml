name: Build Harmonia iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows one-click manual build from GitHub Actions tab

jobs:
  build-ipa:
    name: Build Sideloadable IPA on Cloud macOS
    runs-on: macos-14 # Runs on Apple Silicon (M2) runner

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Harmonia for iPhone (ARM64)
        run: |
          xcodebuild build \
            -project Harmonia.xcodeproj \
            -scheme Harmonia \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build

      - name: Package Harmonia.ipa
        run: |
          APP_PATH=$(find build -name "Harmonia.app" -type d | head -n 1)
          echo "Found Harmonia.app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Harmonia.app not found in build directory!"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Harmonia.ipa Payload
          ls -la Harmonia.ipa

      - name: Upload Harmonia.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harmonia-iPhone15-IPA
          path: Harmonia.ipa
          retention-days: 14
